openapi: 3.1.2
info:
  title: Test Reactive API
  version: "1.0"
servers:
  - url: http://api.server.reactivetest/v1
paths:
  /streamText:
    get:
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                # If schema is array then Flux will be used
                # If single item then Mono
                type: array
                properties:
                  data:
                    type: string

  /streamJson:
    get:
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                type: array
                properties:
                  data:
                    type: object

components:
  schemas:
    simple-reactive-result:
      type: object
      properties:
        ValueKey:
          type: string
        Data:
          type: string
